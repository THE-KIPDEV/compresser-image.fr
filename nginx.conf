# /embed/* doit pouvoir tourner en iframe sur des domaines tiers :
# valeur vide => nginx n'envoie pas le header X-Frame-Options.
map $request_uri $frame_options {
    "~^/embed/"  "";
    default      "SAMEORIGIN";
}

server {
    listen 8080;
    server_name _;

    # Redirection www -> apex (308) : evite le duplicate content SEO (les 2 hotes repondaient 200).
    if ($host ~* "^www\.") {
        return 308 https://compresser-image.fr$request_uri;
    }
    root /var/www/html;
    index index.php;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options $frame_options always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Répertoires et fichiers internes : jamais servis, jamais exécutés (18/09/2026).
    # 🚨 /Dockerfile était servi en clair — Coolify y écrit les variables de build
    #    (clé Stripe live, mot de passe de la base). storage/ gardait les PDF clients sous
    #    un nom devinable ; vendor/, data/ et bin/ s'exécutaient directement.
    location ~ ^/(config|core|controllers|models|views|sql|storage|vendor|data|docker|bin|tests|lang)(/|$) {
        return 404;
    }
    location ~ ^/(Dockerfile|dockerfile|docker-compose\.ya?ml|composer\.(json|lock)|nginx\.conf|[^/]+\.(md|sh|sql|lock|ya?ml|example|dist|bak|log))$ {
        return 404;
    }

    # Static files (CSS, JS, images)
    location /public/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Uploads directory
    location /uploads/ {
        expires 1h;
        try_files $uri =404;
    }

    # Favicon
    location = /favicon.ico {
        rewrite ^ /public/images/favicon.svg last;
    }

    # Front controller
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP processing
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    # Seul le contrôleur frontal s'exécute ; tout autre .php répond 404.
    location ~ \.php$ {
        return 404;
    }

    # Block access to sensitive files/directories
    location ~ /\. { deny all; }
    location ~ \.(env|sql|md)$ { deny all; }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;

    # Allow 55MB uploads for Pro
    client_max_body_size 55M;
}
